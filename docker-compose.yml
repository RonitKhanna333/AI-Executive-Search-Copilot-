services:
  postgres:
    image: ankane/pgvector:latest
    container_name: aesc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aesc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aesc_password}
      POSTGRES_DB: ${POSTGRES_DB:-aesc_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aesc_user} -d ${POSTGRES_DB:-aesc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aesc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aesc_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aesc_user}:${POSTGRES_PASSWORD:-aesc_password}@postgres:5432/${POSTGRES_DB:-aesc_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-aesc_user}:${POSTGRES_PASSWORD:-aesc_password}@postgres:5432/${POSTGRES_DB:-aesc_db}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey-change-in-production-32chars}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aesc_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aesc_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - aesc_network

volumes:
  postgres_data:
  uploads_data:

networks:
  aesc_network:
    driver: bridge
